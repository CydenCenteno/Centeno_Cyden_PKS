<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360" role="img" aria-label="CIA triad diagram">
  <rect width="600" height="360" fill="#ffffff"/>
  <polygon points="300,40 70,320 530,320" fill="#eef2ff" stroke="#3730a3" stroke-width="3"/>
  <circle cx="300" cy="40" r="26" fill="#3730a3"/>
  <circle cx="70" cy="320" r="26" fill="#0f766e"/>
  <circle cx="530" cy="320" r="26" fill="#b45309"/>
  <text x="300" y="46" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#fff">C</text>
  <text x="70" y="326" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#fff">I</text>
  <text x="530" y="326" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#fff">A</text>
  <text x="300" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1e1b4b">Confidentiality</text>
  <text x="300" y="122" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#1e1b4b">Only authorized access</text>
  <text x="150" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#134e4a">Integrity</text>
  <text x="150" y="305" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#134e4a">Data stays accurate</text>
  <text x="450" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#78350f">Availability</text>
  <text x="450" y="305" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#78350f">Accessible when needed</text>
  <text x="300" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#3730a3">CIA</text>
  <text x="300" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#4b5563">Security core goals</text>
</svg>
